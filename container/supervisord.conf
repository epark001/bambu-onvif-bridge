[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
childlogdir=/run

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[eventlistener:fatal-listener]
command=python -m bpo_runtime.fatal_listener
events=PROCESS_STATE_FATAL
priority=1
autostart=true
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:network]
command=python -m bpo_runtime.network_manager
priority=10
autostart=true
autorestart=unexpected
startsecs=1
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:overlay]
command=python /app/bambu_overlay.py
environment=CONFIG_PATH="/run/bambu-onvif-bridge/printers.yaml",OUTPUT_DIR="/data/overlay"
priority=20
autostart=true
autorestart=unexpected
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:go2rtc]
command=go2rtc -config /run/bambu-onvif-bridge/go2rtc.yaml
priority=20
autostart=true
autorestart=unexpected
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:onvif]
command=python -m bpo_runtime.start_onvif
directory=/opt/onvif-server
priority=30
autostart=true
autorestart=unexpected
startsecs=65
startretries=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

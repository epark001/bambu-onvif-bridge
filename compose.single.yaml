services:
  bambu-onvif-bridge:
    build: .
    image: ghcr.io/epark001/bambu-onvif-bridge:local
    container_name: bambu-onvif-bridge
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      TZ: America/Los_Angeles
    volumes:
      - ./config.yaml:/config/config.yaml:ro
